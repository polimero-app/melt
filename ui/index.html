<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth bg-gray-50 dark:bg-gray-900">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fafb">
  <title>Melt</title>
  <script>
    // Match the saved or system theme before first paint; App.vue owns it from then on.
    const theme = localStorage.getItem('theme')
    const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.classList.toggle('dark', dark)
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111827' : '#f9fafb')
  </script>
</head>
<body class="h-full text-gray-700 antialiased dark:text-gray-300">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
