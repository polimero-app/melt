name: Release packaging

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            bundles: deb,rpm
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bundles: deb,rpm
          - name: macos-amd64
            os: macos-15-intel
            bundles: dmg
          - name: macos-arm64
            os: macos-15
            bundles: dmg
          - name: windows-amd64
            os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm
      - name: Point openssl-sys at the runner's OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL/" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/Program Files/OpenSSL/lib/VC/x64/MD" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/Program Files/OpenSSL/include" >> $env:GITHUB_ENV
      - name: Verify automated release qualification
        if: runner.os == 'Linux'
        run: make release-qualification
      - run: bun install --cwd ui --frozen-lockfile
        if: runner.os != 'Linux'
      - run: bun run --cwd ui build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build native installer
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-packages
          path: target/release/bundle/
          if-no-files-found: error

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require frozen release evidence
        run: make release-evidence RELEASE_TAG="${GITHUB_REF_NAME}"
