version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # ponytail: bun needs its own entry; npm does not cover bun.lock.
  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
