[workspace]
members = [
  "crates/melt-core",
  "crates/melt-cli",
  "crates/melt-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/polimero-app/melt"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "default-tls"] }
url = "2"
keyring = { version = "4", default-features = false, features = ["v1"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
openssl = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
socket2 = "0.6"
async-trait = "0.1"
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
png = "0.18"
# Pinned: TPAP support is weeks old; upgrade deliberately. Keep the debug,
# python and json-schema features off.
tapo = { version = "=0.11.1", default-features = false }

# Desktop commands are sync `#[tauri::command(async)]` handlers, so their
# blocking I/O runs on Tauri's tokio workers. reqwest::blocking panics there
# only when built with debug assertions (release has no check), which broke
# the firmware check and Moonraker commands in development builds.
# ponytail: if blocked workers ever starve Tauri, run command bodies through
# tokio::task::block_in_place instead.
[profile.dev.package.reqwest]
debug-assertions = false
