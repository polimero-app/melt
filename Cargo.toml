[workspace]
members = [
  "crates/melt-core",
  "crates/melt-cli",
  "crates/melt-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/polimero-app/melt"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "default-tls"] }
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-openssl"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
openssl = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
base64 = "0.23"
zip = { version = "8", default-features = false, features = ["deflate"] }
socket2 = "0.6"
webrtc = "0.17.2"
png = "0.18"
