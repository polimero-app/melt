[workspace]
members = [
  "crates/polimero-core",
  "crates/polimero-cli",
  "crates/polimero-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/polimero-app/app"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "default-tls"] }
rustls = "0.23"
url = "2"
keyring = "3"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
native-tls = "0.2"
base64 = "0.22"
