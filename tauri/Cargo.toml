[workspace]
members = [
  "crates/polimero-core",
  "crates/polimero-cli",
  "crates/polimero-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/polimero-app/app"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

